[project]
name = "library-project"
version = "0.1.0"
description = ""
authors = [
    {name = "kseniya-shaykhvalieva",email = "kseniyashajhvalieva@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "django (>=6.0.7,<7.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "ipython (>=9.15.0,<10.0.0)",
    "django-filter (>=26.1,<27.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "black (>=26.5.1,<27.0.0)"
]

[tool.black]
line-length = 119

[tool.isort]
line_length = 119

[tool.poetry]
packages = [{include = "config"}, {include = "users"}]

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = "venv|__pycache__"
